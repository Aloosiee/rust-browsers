<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="pages.css">
<style>
  main { padding-top: 12vh; text-align: center; }
  .logo { width: 72px; height: 72px; margin-bottom: 20px; }
  form { display: flex; max-width: 620px; margin: 0 auto 48px; }
  #q {
    flex: 1; font-size: 17px; padding: 14px 18px; border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 16px; max-width: 760px; margin: 0 auto; }
  .site { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: inherit; padding: 12px 6px; border-radius: 10px; position: relative; }
  .site:hover { background: var(--hover); }
  .tile { width: 64px; height: 64px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); display: grid; place-items: center; font-size: 26px; font-weight: 600; color: var(--muted); overflow: hidden; }
  .tile img { width: 32px; height: 32px; }
  .site .name { font-size: 13px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 40px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="icon.svg" alt="">
  <form id="search">
    <input id="q" type="search" autocomplete="off" placeholder="Search the web" aria-label="Search the web">
  </form>
  <div class="sites" id="sites"></div>
  <p class="hint" id="hint" hidden>Pages you visit often will show up here.</p>
</main>
<script src="pages.js"></script>
<script>
  const q = document.getElementById('q');
  document.getElementById('search').addEventListener('submit', (e) => {
    e.preventDefault();
    if (q.value.trim()) browser.call('navigate', { input: q.value });
  });

  async function load() {
    const { engine, sites } = await browser.call('newtab.data');
    q.placeholder = `Search with ${engine} or enter address`;
    const box = document.getElementById('sites');
    box.textContent = '';
    for (const s of sites) {
      let host = s.url;
      try { host = new URL(s.url).hostname.replace(/^www\./, ''); } catch (_) {}
      const tile = el('span', { class: 'tile' });
      const img = favicon(s.url);
      img.onerror = () => { tile.textContent = host.charAt(0).toUpperCase(); };
      if (img.src) tile.append(img); else tile.textContent = host.charAt(0).toUpperCase();
      const link = el('a', { class: 'site', href: s.url, title: s.title || s.url,
        onclick: (e) => { e.preventDefault(); openUrl(s.url, e); },
        onauxclick: (e) => { if (e.button === 1) { e.preventDefault(); openUrl(s.url, e); } } },
        tile, el('span', { class: 'name' }, s.title || host));
      box.append(link);
    }
    document.getElementById('hint').hidden = sites.length > 0;
  }
  load();
</script>
</body>
</html>
