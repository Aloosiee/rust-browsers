<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browser toolbar</title>
<link rel="stylesheet" href="chrome.css">
</head>
<body>
<div id="bars">
  <div id="tabstrip" role="tablist">
    <div id="private-badge" hidden title="Private window: history, cookies and site data are forgotten when it closes">
      <svg viewBox="0 0 16 16"><path d="M1.5 6.5c0-1 .8-1.5 1.8-1.5h9.4c1 0 1.8.5 1.8 1.5 0 2.6-1.4 4.5-3.6 4.5-1.6 0-2.2-1.4-2.9-1.4s-1.3 1.4-2.9 1.4c-2.2 0-3.6-1.9-3.6-4.5z" fill="currentColor"/><circle cx="5" cy="7.5" r="1.2" fill="#25003e"/><circle cx="11" cy="7.5" r="1.2" fill="#25003e"/></svg>
      Private
    </div>
    <div id="tabs"></div>
    <button id="new-tab" class="icon" title="Open a new tab (Ctrl+T)" aria-label="New tab">
      <svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div id="navbar">
    <button id="back" class="icon" title="Go back one page (Alt+Left)" aria-label="Back">
      <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="forward" class="icon" title="Go forward one page (Alt+Right)" aria-label="Forward">
      <svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="reload" class="icon" title="Reload current page (Ctrl+R)" aria-label="Reload">
      <svg class="reload-icon" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="stop-icon" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
    <button id="home" class="icon" title="Home page (Alt+Home)" aria-label="Home">
      <svg viewBox="0 0 16 16"><path d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h3v-3.5h2V13h3V6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </button>

    <div id="urlbar">
      <span id="site-icon" aria-hidden="true"></span>
      <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address" aria-label="Address and search bar">
      <button id="zoom" class="pill" hidden title="Reset zoom (Ctrl+0)"></button>
      <button id="star" class="icon small" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page">
        <svg viewBox="0 0 16 16"><path d="m8 1.8 1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <button id="downloads" class="icon" title="Downloads (Ctrl+J)" aria-label="Downloads">
      <svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13.5h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="downloads-badge" hidden></span>
    </button>
    <button id="menu" class="icon" title="Open application menu" aria-label="Application menu">
      <svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div id="infobar" hidden role="alert">
    <span id="infobar-text"></span>
    <button id="infobar-accept" class="button primary"></button>
    <button id="infobar-cancel" class="button"></button>
  </div>

  <div id="bookmarksbar" hidden></div>

  <div id="findbar" hidden>
    <input id="find" type="text" spellcheck="false" placeholder="Find in page" aria-label="Find in page">
    <button id="find-prev" class="icon small" title="Previous match (Shift+F3)" aria-label="Previous match">
      <svg viewBox="0 0 16 16"><path d="m4 10 4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="find-next" class="icon small" title="Next match (F3)" aria-label="Next match">
      <svg viewBox="0 0 16 16"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span id="find-status"></span>
    <button id="find-close" class="icon small" title="Close find bar (Esc)" aria-label="Close find bar">
      <svg viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>

<div id="suggestions" role="listbox" hidden></div>

<script src="shortcuts.js"></script>
<script src="chrome.js"></script>
</body>
</html>
