<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f2ee; color: #1d1d1f; }
  main { max-width: 760px; margin: 0 auto; padding: 56px 24px; }
  h1 { font-size: 40px; margin: 0; letter-spacing: -0.5px; }
  .sub { color: #6b6b6b; margin: 6px 0 32px; }
  form { display: flex; gap: 8px; margin-bottom: 36px; }
  input[type=search] { flex: 1; font-size: 17px; padding: 12px 16px; border: 1px solid #c9c5bc; border-radius: 10px; background: white; }
  button { font-size: 16px; padding: 0 20px; border: 0; border-radius: 10px; background: #e2531f; color: white; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .grid a { display: block; padding: 16px; border-radius: 12px; background: white; color: inherit; text-decoration: none; border: 1px solid #e3dfd6; }
  .grid a:hover { border-color: #e2531f; }
  .grid b { display: block; margin-bottom: 4px; }
  .grid span { color: #777; font-size: 13px; }
  footer { margin-top: 40px; color: #888; font-size: 13px; }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1b1a; color: #ecebe8; }
    input[type=search], .grid a { background: #2a2927; border-color: #3a3835; color: #ecebe8; }
  }
</style>
</head>
<body>
<main>
  <h1 id="greeting">Hello</h1>
  <p class="sub">Servo engine, with SpiderMonkey for JavaScript and Stylo for CSS.</p>
  <form id="search">
    <input type="search" id="q" placeholder="Search DuckDuckGo or type a URL" autofocus>
    <button>Search</button>
  </form>
  <div class="grid">
    <a href="https://servo.org"><b>Servo</b><span>The engine behind this browser</span></a>
    <a href="https://en.wikipedia.org"><b>Wikipedia</b><span>Encyclopedia</span></a>
    <a href="https://news.ycombinator.com"><b>Hacker News</b><span>Tech news</span></a>
    <a href="https://github.com"><b>GitHub</b><span>Code hosting</span></a>
    <a href="https://www.rust-lang.org"><b>Rust</b><span>The language</span></a>
    <a href="https://demo.servo.org"><b>Servo demos</b><span>WebGL, CSS and more</span></a>
  </div>
  <footer id="foot"></footer>
</main>
<script>
  const h = new Date().getHours();
  document.getElementById('greeting').textContent = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  document.getElementById('search').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = document.getElementById('q').value.trim();
    if (!q) return;
    const looksLikeUrl = /^[a-z]+:\/\//i.test(q) || (/^[^\s]+\.[a-z]{2,}(\/|$)/i.test(q));
    location.href = looksLikeUrl ? (q.includes('://') ? q : 'https://' + q) : 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(q);
  });
  const tick = () => { document.getElementById('foot').textContent = new Date().toLocaleString(); };
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
