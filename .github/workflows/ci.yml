name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rustbrowser:
    name: rustbrowser (fmt, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustbrowser
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustbrowser
      - name: Install fonts used by layout tests
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: cargo fmt --check
      - run: cargo build --release --locked
      - run: cargo test --release --locked

  servobrowser-fmt:
    name: servobrowser (fmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servobrowser
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
